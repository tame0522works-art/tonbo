name: Deploy to GitHub Pages

# main への push で確かめて公開する。Pull Request（Dependabot の更新など）では確かめるだけで公開しない
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 公開は1つずつ順に。Pull Request は Pull Request ごとに、新しい push が来たら古い実行をやめる
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # ubuntu-latest は予告なく新しい版に切り替わり、日本語フォントの入れ方や Chrome の場所が変わりうるので、版を固定する
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Ubuntu には日本語フォントがないので、埋め込みのない日本語フォントのページの描画を確かめるために入れる
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      # 公開と同じ設定でビルドしたものを、ヘッドレスの Chrome で操作して確かめる
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e-failures
          if-no-files-found: ignore
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    # 公開に要る権限は、公開の手順にだけ持たせる
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
