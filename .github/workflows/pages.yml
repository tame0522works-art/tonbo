name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest は予告なく新しい版に切り替わり、日本語フォントの入れ方や Chrome の場所が変わりうるので、版を固定する
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Ubuntu には日本語フォントがないので、埋め込みのない日本語フォントのページの描画を確かめるために入れる
      - run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
      # 公開と同じ設定でビルドしたものを、ヘッドレスの Chrome で操作して確かめる
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: e2e-failures
          if-no-files-found: ignore
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
